name: CI Upstream
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, labeled]
  schedule:
    - cron: "0 0 * * *" # Daily “At 00:00” UTC
  workflow_dispatch: # allows you to trigger the workflow run manually

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: 3

jobs:
  detect-ci-trigger:
    name: detect upstream-dev ci trigger
    runs-on: ubuntu-slim
    if: |
      github.repository == 'pydata/xarray'
      && (github.event_name == 'push' || github.event_name == 'pull_request')
      && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: xarray-contrib/ci-trigger@10cd2bfec3484946a4058a421ddf9cfad101e715 # v1.2.1
        id: detect-trigger
        with:
          keyword: "[test-upstream]"

  cache-pixi-lock:
    name: cache pixi.lock
    runs-on: ubuntu-latest
    needs: detect-ci-trigger
    if: |
      always()
      && github.repository == 'pydata/xarray'
      && (
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        || (
          github.event_name == 'pull_request'
          && (
            needs.detect-ci-trigger.outputs.triggered == 'true'
            || contains( github.event.pull_request.labels.*.name, 'run-upstream')
          )
        )
      )

    env:
      MANIFEST_PATH: ci/nightly/pixi.toml
      LOCK_PATH: ci/nightly/pixi.lock

    outputs:
      cache-key: ${{ steps.pixi-lock.outputs.cache-key }}
      pixi-version: ${{ steps.pixi-lock.outputs.pixi-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Parcels-code/pixi-lock/create-and-cache@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        id: pixi-lock
        with:
          manifest-path: ${{ env.MANIFEST_PATH }}
          hash-files: |
            ${{ env.MANIFEST_PATH }}
            pyproject.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixi-lock
          path: ${{ env.LOCK_PATH }}

  upstream-dev:
    name: upstream-dev
    runs-on: ubuntu-latest
    needs: cache-pixi-lock
    if: |
      always() && needs.cache-pixi-lock.result == 'success'

    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        pixi-env: ["test-nightly"]

    env:
      ENV: ${{ matrix.pixi-env }}
      MANIFEST_PATH: ci/nightly/pixi.toml

    outputs:
      log-file: ${{ steps.determine-log-path.outputs.log-file }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags.
          persist-credentials: false
      - name: Determine log path
        id: determine-log-path
        run: |
          echo "log-file=output-${ENV}-log.jsonl" >> $GITHUB_OUTPUT;
      - name: Restore cached pixi lockfile
        uses: Parcels-code/pixi-lock/restore@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        with:
          manifest-path: ${{ env.MANIFEST_PATH }}
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
          cache: true
          environments: ${{ matrix.pixi-env }}
          manifest-path: ${{ env.MANIFEST_PATH }}
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Version info
        run: |
          pixi run --manifest-path "$MANIFEST_PATH" -e $ENV -- python xarray/util/print_versions.py
      - name: Import xarray
        run: |
          pixi run --manifest-path "$MANIFEST_PATH" -e $ENV -- python -c 'import xarray'
      - name: Run Tests
        if: success()
        id: status
        env:
          LOG_PATH: ${{ steps.determine-log-path.outputs.log-file }}
        run: |
          pixi run \
            --manifest-path "$MANIFEST_PATH" \
            -e $ENV \
            -- \
            python -m pytest --timeout=60 -rf -nauto --report-log "$LOG_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: log file
          path: ${{ steps.determine-log-path.outputs.log-file }}

  create-issue:
    name: report failing upstream-dev runs
    needs: upstream-dev
    runs-on: ubuntu-slim
    if: |
      always()
      && needs.upstream-dev.result == 'failure'
      && github.event_name == 'schedule'
      && github.repository_owner == 'pydata'

    permissions:
      issues: write # open or edit an issue for failed CI runs

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: log file
          path: logs/
      - name: Generate and publish the report
        uses: scientific-python/issue-from-pytest-log-action@054799b34bd75a5fd6c86277a4a8a575224e60c6 # v1.6.1
        with:
          log-path: logs/${{ needs.upstream-dev.outputs.log-file }}

  mypy-upstream-dev:
    name: mypy-upstream-dev
    runs-on: ubuntu-latest
    needs: cache-pixi-lock
    if: |
      always()
      && contains( github.event.pull_request.labels.*.name, 'run-upstream')

    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        pixi-env: ["mypy-upstream"]

    env:
      ENV: ${{ matrix.pixi-env }}
      MANIFEST_PATH: ci/nightly/pixi.toml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags.
          persist-credentials: false

      - name: Restore cached pixi lockfile
        uses: Parcels-code/pixi-lock/restore@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        with:
          manifest-path: ${{ env.MANIFEST_PATH }}
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
          cache: true
          environments: ${{ matrix.pixi-env }}
          manifest-path: ${{ env.MANIFEST_PATH }}
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: set environment variables
        run: |
          echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "PYTHON_VERSION=$(pixi run --manifest-path "$MANIFEST_PATH" -e $ENV -- python --version | cut -d' ' -f2 | cut -d. -f1,2)" >> $GITHUB_ENV
      - name: Version info
        run: |
          pixi run --manifest-path "$MANIFEST_PATH" -e $ENV -- python xarray/util/print_versions.py
      - name: Run mypy
        run: |
          pixi run --manifest-path "$MANIFEST_PATH" -e $ENV -- python -m mypy --install-types --non-interactive --cobertura-xml-report mypy_report
      - name: Upload mypy coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: mypy_report/cobertura.xml
          flags: mypy
          env_vars: PYTHON_VERSION
          name: codecov-umbrella
          fail_ci_if_error: false
