name: Upload nightly wheels
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts:
    name: Build artifacts
    runs-on: ubuntu-latest
    if: github.repository == 'pydata/xarray'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: false
          environments: build-wheels

      - name: Build tarball and wheels
        id: build
        run: |
          pixi run build-wheels

      - name: Check built artifacts
        id: check
        run: |
          pixi run -e build-wheels python -m twine check --strict dist/*
          pwd
          if [ -f dist/xarray-0.0.0.tar.gz ]; then
              echo "❌ INVALID VERSION NUMBER"
              exit 1
          else
              echo "✅ Looks good"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: releases
          path: dist

  upload:
    name: Publish artifacts
    needs: build-artifacts
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    environment:
      name: scientific-python-nightly-wheels

    permissions:
      contents: read
      issues: write # report failing uploads

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: releases
          path: dist

      - name: Upload wheel
        id: upload
        uses: scientific-python/upload-nightly-action@16fa02eacee1655195143de09f03676e60ef2bf5 # 0.6.5
        with:
          anaconda_nightly_upload_token: ${{ secrets.ANACONDA_NIGHTLY }}
          artifacts_path: dist

      - name: Create or update failure issue
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_LABEL: "CI"
          ISSUE_TITLE: "Nightly wheel build/upload failed"
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository}}/actions/runs/${{ github.run_id }}
          TEMPLATE: ".github/nightly-wheel-failure-template.md"
        run: |
          # Read the template
          template=$(cat "$TEMPLATE")

          # Replace placeholders
          issue_body="${template//\{\{WORKFLOW\}\}/$GITHUB_WORKFLOW}"
          issue_body="${issue_body//\{\{RUN_ID\}\}/$GITHUB_RUN_ID}"
          issue_body="${issue_body//\{\{RUN_URL\}\}/$GITHUB_RUN_URL}"
          issue_body="${issue_body//\{\{DATE\}\}/$(date -u)}"

          # Check for existing open issue with same title
          existing_issue=$(gh issue list --state open --label "$ISSUE_LABEL" --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')

          if [ -n "$existing_issue" ]; then
            echo "Found existing open issue #$existing_issue, updating it..."
            echo "$issue_body" | gh issue edit "$existing_issue" --body-file -
            echo "Updated existing issue #$existing_issue"
          else
            echo "No existing open issue found, creating new one..."
            echo "$issue_body" | gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file - \
              --label "$ISSUE_LABEL"
            echo "Created new issue"
          fi
