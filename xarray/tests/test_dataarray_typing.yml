- case: test_mypy_dataarray_type_parameters
  main: |
    from typing import Any
    from xarray import DataArray

    def f(a: DataArray, b: DataArray[Any, Any, str]) -> None:
        # the dimension and variable name types default to Hashable, and the
        # variable name type to the dimension type
        reveal_type(a)  # N: Revealed type is "xarray.core.dataarray.DataArray[Any, Any, typing.Hashable, typing.Hashable]"
        reveal_type(b)  # N: Revealed type is "xarray.core.dataarray.DataArray[Any, Any, str, str]"
        reveal_type(b.dims)  # N: Revealed type is "tuple[str, ...]"
        reveal_type(b.name)  # N: Revealed type is "str | None"

- case: test_mypy_dataarray_init
  main: |
    import numpy as np
    from xarray import DataArray

    # the dtype is inferred from the data, the dimension type from dims and the
    # variable name type from the name and the keys of coords
    reveal_type(DataArray(np.zeros(2)))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], typing.Hashable, typing.Hashable]"
    reveal_type(DataArray([1, 2], dims="x"))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], str, str]"
    reveal_type(DataArray([1.0, 2.0], dims=["x"], name="a"))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str]"
    reveal_type(DataArray([1, 2], dims="x", coords={"x": [0, 1]}))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], str, str]"
    reveal_type(DataArray([1, 2], dims=[0], name=1))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], int, int]"
    # names of different types
    reveal_type(DataArray([1, 2], dims="x", coords={"x": [0, 1]}, name=1))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], str, object]"
    # another DataArray keeps its types
    da = DataArray([1, 2], dims="x", name="a")
    reveal_type(DataArray(da))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], str, str]"

- case: test_mypy_dataarray_properties
  main: |
    from xarray import DataArray

    da = DataArray([1.0, 2.0], dims="x", coords={"x": [0, 1]}, name="a")
    reveal_type(da.dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(da.name)  # N: Revealed type is "str | None"
    reveal_type(da.dtype)  # N: Revealed type is "numpy.dtype[numpy.float64]"
    reveal_type(da.variable)  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    # a coordinate has the dimension and variable name types of its DataArray
    reveal_type(da.coords["x"])  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], Any, str, str]"
    reveal_type(da["x"])  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], Any, str, str]"

- case: test_mypy_dataarray_shape_and_dtype
  main: |
    from xarray import DataArray

    da = DataArray([1.0, 2.0], dims="x", name="a")
    # the dtype is kept where it cannot change
    reveal_type(da.isel(x=0))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str]"
    reveal_type(da.transpose("x"))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str]"
    reveal_type(da.copy())  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str]"
    # and changed or unknown otherwise
    reveal_type(da.astype(int))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], Any, str, str]"
    reveal_type(da.isnull())  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.bool[bool]], str, str]"
    reveal_type(da.where(da > 0))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], Any, str, str]"
    reveal_type(da.mean())  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], Any, str, str]"
    reveal_type(da.any())  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.bool[bool]], str, str]"
    reveal_type(da.argmin("x"))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], str, str]"

- case: test_mypy_dataarray_names
  main: |
    from xarray import DataArray

    da = DataArray([[1.0, 2.0]], dims=("x", "y"), name="a")
    # the types of new names are added
    reveal_type(da.rename(1))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str | int]"
    reveal_type(da.rename(x="z"))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str]"
    reveal_type(da.rename({"x": 0}))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str | int, str | int]"
    reveal_type(da.swap_dims(x="b"))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str]"
    reveal_type(da.expand_dims("z"))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str]"
    reveal_type(da.expand_dims({0: 2}))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str | int, str | int]"
    reveal_type(da.expand_dims(z=2))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str]"
    reveal_type(da.stack(z=["x", "y"]))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str]"
    reveal_type(da.assign_coords(b=("x", [0])))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str]"
    reveal_type(da.assign_coords({0: ("x", [0])}))  # N: Revealed type is "xarray.core.dataarray.DataArray[tuple[int, ...], numpy.dtype[numpy.float64], str, str | int]"
    # str names stay str, so the result can be assigned to the same variable
    da = da.assign_coords(x=[0]).rename("b")

