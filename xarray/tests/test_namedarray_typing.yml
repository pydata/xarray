    reveal_type(from_array([("a", 1), ("b", 2)], [[1, 2], [3, 4]]).dims)  # N: Revealed type is "tuple[tuple[str, int], ...]"

- case: test_mypy_namedarray_dims_setter
  main: |
    from typing import Any

    import numpy as np
    from xarray.namedarray.core import NamedArray

    x: NamedArray[Any, Any, str] = NamedArray(("x",), np.zeros(2))
    x.dims = ("y",)
    x.dims = (1,)
  out: |
    main:8: error: Incompatible types in assignment (expression has type "tuple[int]", variable has type "Iterable[str]")  [assignment]

- case: test_mypy_namedarray_sizes
  main: |
    from typing import Any

    import numpy as np
    from xarray.namedarray.core import NamedArray

    x: NamedArray[Any, Any, tuple[str, int]] = NamedArray((("a", 1),), np.zeros(2))

    reveal_type(x.sizes)  # N: Revealed type is "dict[tuple[str, int], int]"
    reveal_type(x.chunksizes)  # N: Revealed type is "typing.Mapping[tuple[str, int], tuple[int, ...]]"

- case: test_mypy_namedarray_new_dims
  main: |
    from typing import Any

    import numpy as np
    from xarray.namedarray.core import NamedArray

    x: NamedArray[Any, np.dtype[np.float64], str] = NamedArray(("x",), np.zeros(2))

    # keeps the dim type
    reveal_type(x._new())  # N: Revealed type is "xarray.namedarray.core.NamedArray[Any, numpy.dtype[numpy.float64], str]"
    reveal_type(x._new(data=np.zeros(2, dtype=np.int8)).dims)  # N: Revealed type is "tuple[str, ...]"
    # changes the dim type
    new_dims: list[tuple[str, int]] = [("a", 1)]
    reveal_type(x._new(dims=new_dims))  # N: Revealed type is "xarray.namedarray.core.NamedArray[Any, numpy.dtype[numpy.float64], tuple[str, int]]"
    reveal_type(x._new(dims=(1,), data=np.zeros(2)).dims)  # N: Revealed type is "tuple[int, ...]"

- case: test_mypy_namedarray_get_axis_num
  main: |
    from typing import Any

    import numpy as np
    from xarray.namedarray.core import NamedArray

    x: NamedArray[Any, Any, tuple[str, int]] = NamedArray((("a", 1), ("b", 2)), np.zeros((2, 3)))

    # a single tuple dim is not supported: at runtime any non-str iterable is
    # treated as multiple dims, so tuple dims have to be wrapped in a list
    reveal_type(x.get_axis_num([("a", 1)]))  # N: Revealed type is "tuple[int, ...]"
    reveal_type(x.get_axis_num([("a", 1), ("b", 2)]))  # N: Revealed type is "tuple[int, ...]"
    x.get_axis_num(1)
  out: |
    main:12: error: No overload variant of "get_axis_num" of "NamedArray" matches argument type "int"  [call-overload]
    main:12: note: Possible overload variants:
    main:12: note:     def get_axis_num(self, dim: str) -> int
    main:12: note:     def get_axis_num(self, dim: Iterable[tuple[str, int]]) -> tuple[int, ...]
    main:12: note:     def get_axis_num(self, dim: tuple[str, int]) -> int

