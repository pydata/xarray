- case: test_mypy_namedarray_aggregation_dims
  main: |
    from typing import Any

    import numpy as np
    from xarray.namedarray.core import NamedArray

    x: NamedArray[Any, Any, tuple[str, int]] = NamedArray((("a", 1), ("b", 2)), np.zeros((2, 3)))

    reveal_type(x.sum([("a", 1)]).dims)  # N: Revealed type is "tuple[tuple[str, int], ...]"
    reveal_type(x.mean(...).dims)  # N: Revealed type is "tuple[tuple[str, int], ...]"
    x.sum(["a"])
  out: |
    main:10: error: List item 0 has incompatible type "str"; expected "tuple[str, int]"  [list-item]

- case: test_mypy_namedarray_aggregation_single_dim
  main: |
    from typing import Any

    import numpy as np
    from xarray.namedarray.core import NamedArray

    x: NamedArray[Any, Any, str] = NamedArray(("x", "y"), np.zeros((2, 3)))

    reveal_type(x.sum("x").dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(x.max(dim="y").dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(x.cumsum("x").dims)  # N: Revealed type is "tuple[str, ...]"
    x.sum(1)
  out: |
    main:11: error: Argument 1 to "sum" of "NamedArrayAggregations" has incompatible type "int"; expected "Iterable[str] | EllipsisType | None"  [arg-type]

- case: test_mypy_namedarray_aggregation_multiple_dims
  main: |
    from typing import Any

    import numpy as np
    from xarray.namedarray.core import NamedArray

    x: NamedArray[Any, Any, int] = NamedArray((1, 2, 3), np.zeros((2, 3, 4)))

    reveal_type(x.sum([1, 2]).dims)  # N: Revealed type is "tuple[int, ...]"
    reveal_type(x.mean(dim=(1, 3)).dims)  # N: Revealed type is "tuple[int, ...]"
    reveal_type(x.std(dim=None).dims)  # N: Revealed type is "tuple[int, ...]"
    x.sum(["x", "y"])
  out: |
    main:11: error: List item 0 has incompatible type "str"; expected "int"  [list-item]
    main:11: error: List item 1 has incompatible type "str"; expected "int"  [list-item]

- case: test_mypy_namedarray_permute_dims
  main: |
    from typing import Any

    import numpy as np
    from xarray.namedarray.core import NamedArray

    x: NamedArray[Any, Any, int] = NamedArray((1, 2), np.zeros((2, 3)))

    reveal_type(x.permute_dims(2, 1).dims)  # N: Revealed type is "tuple[int, ...]"
    reveal_type(x.permute_dims(2, ...).dims)  # N: Revealed type is "tuple[int, ...]"
    reveal_type(x.T.dims)  # N: Revealed type is "tuple[int, ...]"
    x.permute_dims("y")
  out: |
    main:11: error: Argument 1 to "permute_dims" of "NamedArray" has incompatible type "str"; expected "int | EllipsisType"  [arg-type]

- case: test_mypy_namedarray_expand_dims
  main: |
    from typing import Any

    import numpy as np
    from xarray.namedarray.core import NamedArray

    x: NamedArray[Any, Any, int] = NamedArray((1,), np.zeros(2))

    reveal_type(x.expand_dims(2).dims)  # N: Revealed type is "tuple[int, ...]"
    # the default new dim name is a str
    reveal_type(x.expand_dims().dims)  # N: Revealed type is "tuple[int | str, ...]"

