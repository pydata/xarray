- case: test_mypy_namedarray_from_array_dims
  main: |
    import numpy as np
    from xarray.namedarray.core import from_array

    reveal_type(from_array(("x", "y"), np.zeros((2, 3))).dims)  # N: Revealed type is "tuple[str, ...]"
