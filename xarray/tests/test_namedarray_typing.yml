- case: test_mypy_namedarray_init_str_dims
  main: |
    import numpy as np
    from xarray.namedarray.core import NamedArray

    data = np.zeros((2, 3))

    reveal_type(NamedArray(("x", "y"), data).dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(NamedArray(["x", "y"], data).dims)  # N: Revealed type is "tuple[str, ...]"
    # a single str is also a valid dims argument
    reveal_type(NamedArray("x", np.zeros(2)).dims)  # N: Revealed type is "tuple[str, ...]"

- case: test_mypy_namedarray_init_tuple_dims
  main: |
