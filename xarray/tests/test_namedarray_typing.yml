- case: test_mypy_namedarray_init_literal_dims
  main: |
    from typing import Literal

    import numpy as np
    from xarray.namedarray.core import NamedArray

    dims: tuple[Literal["x", "y"], ...] = ("x", "y")

    reveal_type(NamedArray(dims, np.zeros((2, 3))).dims)  # N: Revealed type is "tuple[Literal['x'] | Literal['y'], ...]"

