- case: test_mypy_variable_init_dims
  main: |
    import numpy as np
    from xarray import Variable

    data = np.zeros((2, 3))

    reveal_type(Variable(("x", "y"), data).dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(Variable(["x", "y"], data).dims)  # N: Revealed type is "tuple[str, ...]"
    # a single str is also a valid dims argument
    reveal_type(Variable("x", np.zeros(2)).dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(Variable((("a", 1), ("b", 2)), data).dims)  # N: Revealed type is "tuple[tuple[str, int], ...]"

- case: test_mypy_variable_init_0d
  main: |
    from xarray import Variable

    # no dims to infer from, so the default dim type is used
    reveal_type(Variable((), 0))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], typing.Hashable]"
    reveal_type(Variable([], 0))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], typing.Hashable]"

