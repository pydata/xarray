- case: test_mypy_variable_covariant
  main: |
    from typing import Any
    import numpy as np
    from xarray import Variable

    def f(v: Variable) -> None: ...

    f(Variable(("x",), np.zeros(2)))
    v: Variable[Any, Any, int] = Variable(("x",), np.zeros(2))
  out: |
    main:8: error: Argument 1 to "Variable" has incompatible type "tuple[str]"; expected "Iterable[int]"  [arg-type]

- case: test_mypy_variable_sizes
  main: |
    from typing import Any
    import numpy as np
    from xarray import Variable

    x: Variable[Any, Any, tuple[str, int]] = Variable((("a", 1),), np.zeros(2))
    reveal_type(x.sizes)  # N: Revealed type is "dict[tuple[str, int], int]"
    reveal_type(x.chunksizes)  # N: Revealed type is "typing.Mapping[tuple[str, int], tuple[int, ...]]"

- case: test_mypy_variable_get_axis_num
  main: |
    from typing import Any
    import numpy as np
    from xarray import Variable

    x: Variable[Any, Any, str] = Variable(("x", "y"), np.zeros((2, 3)))
    reveal_type(x.get_axis_num("x"))  # N: Revealed type is "int"
    reveal_type(x.get_axis_num(["x", "y"]))  # N: Revealed type is "tuple[int, ...]"

    y: Variable[Any, Any, int] = Variable((1, 2), np.zeros((2, 3)))
    reveal_type(y.get_axis_num(1))  # N: Revealed type is "int"
    y.get_axis_num(1.5)
  out: |
    main:11: error: No overload variant of "get_axis_num" of "NamedArray" matches argument type "float"  [call-overload]
    main:11: note: Possible overload variants:
    main:11: note:     def get_axis_num(self, dim: str) -> int
    main:11: note:     def get_axis_num(self, dim: Iterable[int]) -> tuple[int, ...]
    main:11: note:     def get_axis_num(self, dim: int) -> int

- case: test_mypy_variable_keeps_dims
  main: |
    from typing import Any
    import numpy as np
    from xarray import Variable

    x: Variable[Any, Any, str] = Variable(("x", "y"), np.zeros((2, 3)))
    reveal_type(x.isel(x=0).dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(x.copy())  # N: Revealed type is "xarray.core.variable.Variable[Any, Any, str]"
    reveal_type(x.transpose("y", ...).dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(x.T.dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(x.astype(int).dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(x.real.dims)  # N: Revealed type is "tuple[str, ...]"
    reveal_type(x.to_base_variable())  # N: Revealed type is "xarray.core.variable.Variable[Any, Any, str]"
    reveal_type(x.to_index_variable())  # N: Revealed type is "xarray.core.variable.IndexVariable[Any, Any, str]"
    x.transpose(1)
  out: |
    main:14: error: Argument 1 to "transpose" of "Variable" has incompatible type "int"; expected "str | EllipsisType"  [arg-type]

- case: test_mypy_variable_reduce_dims
  main: |
    from typing import Any
    import numpy as np
    from xarray import Variable

    x: Variable[Any, Any, int] = Variable((1, 2), np.zeros((2, 3)))
    reveal_type(x.reduce(np.sum, dim=[1]).dims)  # N: Revealed type is "tuple[int, ...]"
    reveal_type(x.sum(dim=[1]).dims)  # N: Revealed type is "tuple[int, ...]"
    x.reduce(np.sum, dim=["x"])
  out: |
    main:8: error: List item 0 has incompatible type "str"; expected "int"  [list-item]

- case: test_mypy_variable_new_dims
  main: |
    from typing import Any
    import numpy as np
    from xarray import Variable

    x: Variable[Any, Any, str] = Variable(("x",), np.zeros(2))
    # keeps the dim type
    reveal_type(x._new())  # N: Revealed type is "xarray.core.variable.Variable[Any, Any, str]"
    reveal_type(x._new(data=np.zeros(2, dtype=np.int8)))  # N: Revealed type is "xarray.core.variable.Variable[Any, numpy.dtype[Any], str]"
    # changes the dim type
    reveal_type(x._new(dims=(1,)))  # N: Revealed type is "xarray.core.variable.Variable[Any, Any, int]"
    reveal_type(x._new(dims=(1,), data=np.zeros(2)))  # N: Revealed type is "xarray.core.variable.Variable[Any, numpy.dtype[numpy.float64], int]"

- case: test_mypy_index_variable_name
  main: |
    from xarray.core.variable import IndexVariable

    x = IndexVariable(("x",), [1, 2])
    reveal_type(x)  # N: Revealed type is "xarray.core.variable.IndexVariable[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], str]"
    reveal_type(x.name)  # N: Revealed type is "str"
    reveal_type(IndexVariable((1,), [1, 2]).name)  # N: Revealed type is "int"

- case: test_mypy_as_variable
  main: |
    import numpy as np
    from xarray import Variable
    from xarray.core.variable import as_variable

    x = Variable((1,), np.zeros(2))
    reveal_type(as_variable(x))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], int]"
    reveal_type(as_variable(("x", [1, 2])))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], Any, str]"
    reveal_type(as_variable((["x", "y"], np.zeros((2, 3)), {"units": "m"})))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], Any, str]"
    reveal_type(as_variable([1, 2], name="x"))  # N: Revealed type is "xarray.core.variable.Variable[Any, Any, typing.Hashable]"
    reveal_type(as_variable(1))  # N: Revealed type is "xarray.core.variable.Variable[Any, Any, typing.Hashable]"

- case: test_mypy_variable_init_dtype
  main: |
    import numpy as np
    from xarray import Variable

    ints: np.ndarray[tuple[int], np.dtype[np.int8]] = np.zeros(2, dtype=np.int8)

    # the dtype is inferred from duck arrays, the shape is unknown
    reveal_type(Variable("x", np.zeros(2)))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    reveal_type(Variable("x", ints))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._8Bit]], str]"

- case: test_mypy_variable_init_python_data
  main: |
    from xarray import Variable

    # Python scalars and lists, as numpy converts them
    reveal_type(Variable("x", [True, False]))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.bool[bool]], str]"
    reveal_type(Variable("x", [1, 2]))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], str]"
    reveal_type(Variable("x", [1, 2.5]))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    reveal_type(Variable("x", [1j]))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.complex128], str]"
    reveal_type(Variable("x", ["a", "b"]))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.str_], str]"
    reveal_type(Variable(("x", "y"), [[1.0], [2.0]]))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    reveal_type(Variable((), 1.5))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], typing.Hashable]"
    # an empty list becomes float64
    reveal_type(Variable("x", []))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    # mixed lists and tuples (which become 0-d object arrays) have an unknown dtype
    reveal_type(Variable("x", [1, "a"]))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], Any, str]"
    reveal_type(Variable((), (1, 2)))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], Any, typing.Hashable]"

- case: test_mypy_variable_dtype
  main: |
    import numpy as np
    from xarray import Variable

    x = Variable(("x", "y"), np.zeros((2, 3)))
    # these keep the dtype
    reveal_type(x.isel(x=0))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    reveal_type(x.transpose())  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    reveal_type(x.copy())  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    reveal_type(x.dtype)  # N: Revealed type is "numpy.dtype[numpy.float64]"
    # these can change it
    reveal_type(x.astype(int))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], Any, str]"
    reveal_type(x.real)  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], Any, str]"
    reveal_type(x.reduce(np.mean))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], Any, str]"

- case: test_mypy_variable_init_kwargs
  main: |
    from xarray import Variable

    v = Variable(dims="x", data=[1, 2], attrs={"a": 1}, encoding={}, fastpath=True)
    reveal_type(v)  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], str]"

- case: test_mypy_variable_init_scalars
  main: |
    import numpy as np
    from xarray import Variable

    reveal_type(Variable((), True))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.bool[bool]], typing.Hashable]"
    reveal_type(Variable((), 1))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], typing.Hashable]"
    reveal_type(Variable((), 1j))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.complex128], typing.Hashable]"
    reveal_type(Variable((), "a"))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.str_], typing.Hashable]"
    # np.float64 is a subclass of float
    reveal_type(Variable((), np.float64(1)))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], typing.Hashable]"
    # other numpy scalars are not duck arrays for type checkers
    reveal_type(Variable((), np.float32(1)))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], Any, typing.Hashable]"

- case: test_mypy_variable_init_from_variable
  main: |
    import numpy as np
    from xarray import IndexVariable, Variable

    # the data of another Variable is used, so its dtype is kept
    v = Variable("x", np.zeros(2))
    reveal_type(Variable("y", v))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    reveal_type(Variable("y", IndexVariable("x", ["a"])))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.str_], str]"
    reveal_type(IndexVariable("y", v))  # N: Revealed type is "xarray.core.variable.IndexVariable[tuple[int, ...], numpy.dtype[numpy.float64], str]"

- case: test_mypy_variable_init_nested_lists
  main: |
    from xarray import Variable

    reveal_type(Variable(("x", "y", "z"), [[[1.0]]]))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    reveal_type(Variable(("x", "y", "z"), [[[1]]]))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], str]"

- case: test_mypy_variable_init_unknown_dtype
  main: |
    from typing import Any
    import numpy as np
    import pandas as pd
    from xarray import DataArray, Variable

    # data whose dtype is not visible to type checkers
    reveal_type(Variable("x", pd.Index([1.0])))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], Any, str]"
    reveal_type(Variable("x", DataArray([1.0], dims="x")))  # N: Revealed type is "xarray.core.variable.Variable[tuple[int, ...], numpy.dtype[Any], str]"
    # a list of Any matches several overloads, so mypy makes the whole result Any
    xs: list[Any] = [1.0]
    reveal_type(Variable("x", xs))  # N: Revealed type is "xarray.core.variable.Variable[Any, Any, Any]"

- case: test_mypy_index_variable_init
  main: |
    import numpy as np
    from xarray import IndexVariable

    reveal_type(IndexVariable("x", np.zeros(2)))  # N: Revealed type is "xarray.core.variable.IndexVariable[tuple[int, ...], numpy.dtype[numpy.float64], str]"
    reveal_type(IndexVariable("x", [1, 2]))  # N: Revealed type is "xarray.core.variable.IndexVariable[tuple[int, ...], numpy.dtype[numpy.signedinteger[numpy._typing._nbit_base._32Bit | numpy._typing._nbit_base._64Bit]], str]"
    reveal_type(IndexVariable("x", ["a"]))  # N: Revealed type is "xarray.core.variable.IndexVariable[tuple[int, ...], numpy.dtype[numpy.str_], str]"
